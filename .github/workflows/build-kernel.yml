name: Build Kernel
on:
  push:
    branches: [ SukiSU-Ultra ]
  workflow_dispatch:
    inputs:
      enable_ksu:
        description: "是否集成 KernelSU (SukiSU-Ultra builtin)"
        type: boolean
        default: true
      kernel_config:
        description: "内核 defconfig (对应 vendor/<name>_user_defconfig)"
        type: choice
        options:
          - bomb
          - cezanne
          - atom
        default: bomb

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CI: "false"
      # push 触发时 inputs 为空, 用默认值兜底; workflow_dispatch 时按选择走
      ENABLE_KSU: ${{ github.event.inputs.enable_ksu || 'true' }}
      KERNEL_CONFIG: ${{ github.event.inputs.kernel_config || 'bomb' }}
    steps:
    - uses: actions/checkout@v4

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Shanghai date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        sudo apt-get update
        sudo apt install -y curl llvm lld wget git ccache automake flex bison gperf build-essential zip zlib1g-dev g++-multilib libxml2-utils bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev device-tree-compiler kmod python3 dwarves

    - name: Download clang-r383902
      run: |
        # 与官核完全一致的 Clang 版本
        # 官核: Android (6443078 based on r383902) clang version 11.0.1
        # Git commit: b397f81060ce6d701042b782172ed13bee898b79
        # 工具链来源改为 GitHub 镜像（原: android.googlesource.com）
        #   clang-r383902 <- crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078
        #                    (分支 10.0, AndroidVersion.txt: 11.0.1 / based on r383902)
        #   gcc 4.9       <- LineageOS 的 AOSP prebuilts gcc 4.9 镜像
        # GitHub archive 顶层多一层 "<repo>-<branch>/", 用 --strip-components=1 去掉
        mkdir -p $GITHUB_WORKSPACE/clang-aosp/google_clang
        cd $GITHUB_WORKSPACE/clang-aosp/google_clang
        wget -nv --tries=3 --timeout=60 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078/archive/refs/heads/10.0.tar.gz -O clang-r383902.tar.gz
        mkdir -p clang-r383902 && tar xzf clang-r383902.tar.gz -C clang-r383902 --strip-components=1
        rm -f clang-r383902.tar.gz
        # 下载 GCC 工具链
        cd $GITHUB_WORKSPACE/clang-aosp
        wget -nv --tries=3 --timeout=60 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-19.1.tar.gz -O gcc-aarch64.tar.gz
        mkdir -p google_gcc/aarch64-linux-android-4.9 && tar xzf gcc-aarch64.tar.gz -C google_gcc/aarch64-linux-android-4.9 --strip-components=1
        rm -f gcc-aarch64.tar.gz
        wget -nv --tries=3 --timeout=60 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9/archive/refs/heads/lineage-19.1.tar.gz -O gcc-arm.tar.gz
        mkdir -p google_gcc/arm-linux-androideabi-4.9 && tar xzf gcc-arm.tar.gz -C google_gcc/arm-linux-androideabi-4.9 --strip-components=1
        rm -f gcc-arm.tar.gz
        # 打印工具链版本, 便于在日志中核对
        $GITHUB_WORKSPACE/clang-aosp/google_clang/clang-r383902/bin/clang --version | head -2
        $GITHUB_WORKSPACE/clang-aosp/google_gcc/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc --version | head -1

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-bomb
        max-size: 1G

    - name: Setup KernelSU (SukiSU-Ultra builtin)
      if: env.ENABLE_KSU == 'true'
      run: |
        set -e
        echo "KernelSU: 启用 (SukiSU-Ultra, builtin 分支 / 手动钩子)"
        curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

    - name: Patch KernelSU for Linux 4.14 compat
      if: env.ENABLE_KSU == 'true'
      run: |
        set -e
        KSU=KernelSU/kernel
        # 1) fallthrough keyword only exists on 5.x; comment it out for 4.14
        sed -i 's|\bfallthrough;|/* fallthrough */|' $KSU/policy/allowlist.c
        grep -qF '/* fallthrough */' $KSU/policy/allowlist.c
        # 2) USER_ARG_NULL is a pointer but ksu_sulog_capture() takes it by value
        sed -i 's|#define USER_ARG_NULL user_arg_null_ptr()|#define USER_ARG_NULL (*user_arg_null_ptr())|' $KSU/sulog/event.c
        grep -qF '#define USER_ARG_NULL (*user_arg_null_ptr())' $KSU/sulog/event.c
        # 3) ksu_selinux_hide_* only exist on 5.10+; add no-op stubs for older kernels
        sed -i 's|#endif // __KSU_H_KERNEL_INCLUDES|#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 10, 0)\nstatic inline void ksu_selinux_hide_handle_post_fs_data(void) { }\nstatic inline void ksu_selinux_hide_handle_second_stage(void) { }\n#endif\n\n#endif // __KSU_H_KERNEL_INCLUDES|' $KSU/kernel_includes.h
        grep -qF 'ksu_selinux_hide_handle_post_fs_data(void) { }' $KSU/kernel_includes.h
        # 4) KSU_FEATURE_SELINUX_HIDE enum only exists on 5.10+ (include/uapi/feature.h),
        #    but policy/feature.c references it unconditionally -> guard the entry
        perl -0pi -e 's/^(\s*)\[KSU_FEATURE_SELINUX_HIDE\] = "selinux_hide",$/#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n${1}[KSU_FEATURE_SELINUX_HIDE] = "selinux_hide",\n#endif/m' $KSU/policy/feature.c
        awk '/^#if LINUX_VERSION_CODE >= KERNEL_VERSION\(5, 10, 0\)$/ {getline; if ($0 ~ /KSU_FEATURE_SELINUX_HIDE/) ok=1} END{exit !ok}' $KSU/policy/feature.c
        # 5) linux/static_call.h is 5.10+ and unused by KernelSU -> drop the include
        sed -i '\|#include <linux/static_call.h>|d' $KSU/kernel_includes.h
        ! grep -qF 'linux/static_call.h' $KSU/kernel_includes.h
        # 6) extension/cpu_spoof.c needs 5.10+ vDSO/clocksource APIs (vdso/datapage.h,
        #    vdso_data[].clock_mode, VDSO_CLOCKMODE_ARCHTIMER) absent on 4.14 -> stub it
        cat > $KSU/extension/cpu_spoof.c <<'KSUEOF'
        /* 4.14 compat stub: cpu spoof needs 5.10+ vDSO/clocksource APIs. */
        #include <linux/errno.h>
        #include "cpu_spoof.h"
        int ksu_extension_cpu_spoof_io(u32 id, void __user *raw)
        {
            return -EOPNOTSUPP;
        }
        KSUEOF
        grep -qF 'return -EOPNOTSUPP;' $KSU/extension/cpu_spoof.c
        # 7) access_ok() is 3-arg (VERIFY_READ first) on 4.14 vs 2-arg on 5.0+;
        #    kpm.c forgot KernelSU's own ksu_access_ok() compat macro -> use it
        sed -i 's/\([^_a-zA-Z0-9]\)access_ok(/\1ksu_access_ok(/g' $KSU/extension/kpm/kpm.c
        test "$(grep -c 'ksu_access_ok(' $KSU/extension/kpm/kpm.c)" -ge 10
        ! grep -q '[^_]access_ok(' $KSU/extension/kpm/kpm.c
        # 8) ksu_main.c includes the KPM implementation files unconditionally, but they
        #    need 5.x+ (task_struct pids[], C99 for-decls); glue already returns
        #    -EOPNOTSUPP without CONFIG_KPM -> gate the impls on CONFIG_KPM
        sed -i 's|^#include "extension/kpm/kpm.c"|#ifdef CONFIG_KPM\n#include "extension/kpm/kpm.c"|' $KSU/ksu_main.c
        sed -i 's|^#include "extension/kpm/super_access.c"|#include "extension/kpm/super_access.c"\n#endif|' $KSU/ksu_main.c
        awk '/^#ifdef CONFIG_KPM$/ {getline; if ($0 ~ /extension\/kpm\/kpm.c/) ok=1} END{exit !ok}' $KSU/ksu_main.c
        echo "KernelSU 4.14 compat patch applied"

    - name: Build kernel
      run: |
        echo "KERNEL_CONFIG=vendor/${KERNEL_CONFIG}_user_defconfig"
        export PATH=$GITHUB_WORKSPACE/clang-aosp/google_clang/clang-r383902/bin:$GITHUB_WORKSPACE/clang-aosp/google_gcc/aarch64-linux-android-4.9/bin:$GITHUB_WORKSPACE/clang-aosp/google_gcc/arm-linux-androideabi-4.9/bin:$PATH
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=${{ github.actor }}
        make -j1 LLVM=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- vendor/${KERNEL_CONFIG}_user_defconfig
        make -j$(nproc --all) LLVM=1 CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

    - name: Check output
      run: |
        if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "BUILD_OK=true" >> $GITHUB_ENV
        else
            echo "Kernel build failed"
            exit 1
        fi

    - name: Upload kernel
      if: env.BUILD_OK == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz-${{ env.BUILD_TIME }}
        path: out/arch/arm64/boot/Image.gz
